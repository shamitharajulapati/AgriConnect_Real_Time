name: agri_connect
description: "AgriConnect - Farmer Market Intelligence Platform"
publish_to: 'none'
version: 3.0.0+2

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.0.0

  # Backend - Supabase
  supabase_flutter: ^2.5.0

  # HTTP
  dio: ^5.4.3+1

  # Charts
  fl_chart: ^0.68.0

  # Animations
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0

  # UI
  google_fonts: ^6.2.1

  # Voice
  speech_to_text: ^7.0.0

  # Auth
  google_sign_in: ^6.2.1

  # Media
  image_picker: ^1.1.2

  # Utils
  intl: ^0.20.2
  shared_preferences: ^2.2.3
  connectivity_plus: ^6.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/config/
