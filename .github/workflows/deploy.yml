name: CI/CD — AgriConnect

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: cd backend && npm ci && npm test
        env:
          NODE_ENV: test

  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: cd ml_service && pip install -r requirements.txt pytest && python -m pytest tests/

  flutter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.35.3' }
      - run: cd mobile && flutter pub get && flutter analyze --no-fatal-infos && flutter test

  deploy-ml:
    needs: test-ml
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_ML_DEPLOY_HOOK: ${{ secrets.RENDER_ML_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deployment
        if: ${{ env.RENDER_ML_DEPLOY_HOOK != '' }}
        run: curl --fail --show-error --silent --request POST "$RENDER_ML_DEPLOY_HOOK"
      - name: Use Render automatic deploy
        if: ${{ env.RENDER_ML_DEPLOY_HOOK == '' }}
        run: echo "No Render deploy hook is configured; the Render Git integration must deploy this commit automatically."
