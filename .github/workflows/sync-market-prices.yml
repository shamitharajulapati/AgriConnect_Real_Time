name: AgriConnect market price sync

on:
  schedule:
    # Daily at 02:30 India time (21:00 UTC on the previous day).
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check required cloud settings
        env:
          AGMARKNET_KEY: ${{ secrets.AGMARKNET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          test -n "$AGMARKNET_KEY" || { echo "Missing GitHub Actions secret: AGMARKNET_KEY"; exit 1; }
          test -n "$SUPABASE_SERVICE_KEY" || { echo "Missing GitHub Actions secret: SUPABASE_SERVICE_KEY"; exit 1; }
          test -n "$SUPABASE_URL" || { echo "Missing GitHub Actions secret: SUPABASE_URL"; exit 1; }

      - name: Check out the sync script
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install sync dependencies
        working-directory: backend
        run: npm ci --omit=dev

      - name: Fetch market data and save it to Supabase
        working-directory: backend
        env:
          AGMARKNET_KEY: ${{ secrets.AGMARKNET_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: node src/scripts/sync-market-prices.js
