name: AgriConnect market price sync

on:
  schedule:
    - cron: '0 0,6,12,18 * * *'
      timezone: Asia/Kolkata
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: production
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      AGMARKNET_KEY: ${{ secrets.AGMARKNET_KEY }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Sync prices into Supabase
        run: node src/scripts/sync-market-prices.js
