name: AgriConnect market price sync

on:
  schedule:
    # Run daily at 02:30 India time (21:00 UTC on the previous day).
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Check required cloud settings
        env:
          RENDER_ML_URL: ${{ secrets.RENDER_ML_URL }}
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: |
          test -n "$RENDER_ML_URL" || { echo "Missing GitHub Actions secret: RENDER_ML_URL"; exit 1; }
          test -n "$MARKET_SYNC_SECRET" || { echo "Missing GitHub Actions secret: MARKET_SYNC_SECRET"; exit 1; }

      - name: Trigger hosted market sync
        env:
          RENDER_ML_URL: ${{ secrets.RENDER_ML_URL }}
          MARKET_SYNC_SECRET: ${{ secrets.MARKET_SYNC_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --retry 2 --retry-all-errors --max-time 900 \
            --request POST \
            --header "X-Secret: $MARKET_SYNC_SECRET" \
            "${RENDER_ML_URL%/}/market/sync"
